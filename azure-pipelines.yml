trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

# One image per service, all pushed to the same registry. Repository names
# match the container apps (ecom-<service>) used by scripts/GenerateEnvFillCli.ps1.
parameters:
  - name: services
    type: object
    default:
      - name: auth_api
        project: ECom.Auth.Api
        repository: ecom-auth-api
      - name: product_api
        project: ECom.Product.Api
        repository: ecom-product-api
      - name: cart_api
        project: ECom.Cart.Api
        repository: ecom-cart-api
      - name: order_api
        project: ECom.Order.Api
        repository: ecom-order-api
      - name: gateway
        project: ECom.Gateway
        repository: ecom-gateway

variables:
  buildConfiguration: "Release"
  solution: "ecom_micro_services.slnx"
  unitTestsProjects: "tests/**/*.UnitTests.csproj"
  containerRegistry: "ecomcr_connection"
  # Each src/<Service>/Dockerfile.dockerignore is only honoured by BuildKit.
  DOCKER_BUILDKIT: "1"

stages:
  # -----------------------------
  # Restore, build and test
  # -----------------------------
  - stage: Build_Test
    displayName: "Build and test"
    jobs:
      - job: Build_Test
        displayName: "Build and unit test"
        steps:
          - checkout: self
            clean: true

          # Install .NET 10 because the services and tests target net10.0.
          - task: UseDotNet@2
            displayName: "Install .NET 10 SDK"
            inputs:
              packageType: "sdk"
              version: "10.0.x"

          - task: DotNetCoreCLI@2
            displayName: "Restore solution"
            inputs:
              command: "restore"
              projects: "$(solution)"

          - task: DotNetCoreCLI@2
            displayName: "Build solution"
            inputs:
              command: "build"
              projects: "$(solution)"
              arguments: "--configuration $(buildConfiguration) --no-restore"

          # The MSTest package includes Microsoft code coverage, which can emit Cobertura.
          # The task adds --logger trx --results-directory $(Agent.TempDirectory) itself
          # (publishTestResults defaults to true), so do not pass --results-directory here.
          - task: DotNetCoreCLI@2
            displayName: "Run unit tests with coverage"
            inputs:
              command: "test"
              projects: "$(unitTestsProjects)"
              arguments: >
                --configuration $(buildConfiguration)
                --no-build
                --collect:"Code Coverage;Format=cobertura"

          - task: PublishCodeCoverageResults@2
            displayName: "Publish code coverage"
            inputs:
              summaryFileLocation: "$(Agent.TempDirectory)/**/*.cobertura.xml"
              failIfCoverageEmpty: false

  # -----------------------------
  # Build and push service images
  # -----------------------------
  # One job per service so each image builds, pushes and reports independently.
  # Pull request validation builds and tests only; images are pushed from main.
  - stage: Images
    displayName: "Build and push images"
    dependsOn: Build_Test
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - ${{ each service in parameters.services }}:
          - job: Image_${{ service.name }}
            displayName: "${{ service.project }} image"
            steps:
              - checkout: self
                clean: true

              # Build context is the repository root: every image needs
              # ECom.Shared and Directory.Build.* alongside the service.
              - task: Docker@2
                displayName: "Build and push ${{ service.project }} image to ACR"
                inputs:
                  command: "buildAndPush"
                  containerRegistry: "$(containerRegistry)"
                  repository: "${{ service.repository }}"
                  Dockerfile: "src/${{ service.project }}/Dockerfile"
                  buildContext: "$(Build.SourcesDirectory)"
                  tags: |
                    $(Build.BuildId)
                    latest
